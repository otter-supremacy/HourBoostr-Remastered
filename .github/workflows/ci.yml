name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.402"
      - run: dotnet restore HourBoostr.Remastered.slnx --locked-mode
      - run: dotnet build HourBoostr.Remastered.slnx -c Release --no-restore
      - run: dotnet test HourBoostr.Remastered.slnx -c Release --no-build --logger trx
      - run: dotnet list src/HourBoostr.Remastered/HourBoostr.Remastered.csproj package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t hourboostr-remastered:ci .
      - run: python3 tests/container-smoke.py
  members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.402"
      - name: Build Members
        run: |
          dotnet restore src/HourBoostr.Members/HourBoostr.Members.csproj --locked-mode
          dotnet build src/HourBoostr.Members/HourBoostr.Members.csproj -c Release --no-restore
      - name: Test Members API and account isolation
        run: python3 tests/member-staging.py dotnet src/HourBoostr.Members/bin/Release/net10.0/HourBoostr.Members.dll
      - name: Test Pages gateway
        run: node --test website/members-edge/worker.test.mjs
