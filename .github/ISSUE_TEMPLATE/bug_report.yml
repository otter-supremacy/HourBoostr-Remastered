name: Bug report
description: Report a reproducible problem without posting account data.
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials, session files, pairing keys, QR challenges, account configuration, or private chats. Review SECURITY.md before reporting a sensitive issue."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0-preview.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Windows x64, Ubuntu x64, Linux ARM64…"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Windows desktop package
        - Headless release package
        - Source build
        - Docker
        - Other
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or error text
      description: "Review the contents and remove private data before attaching."
